function requireManager(){if(canEdit())return true;showToast('Esta acción requiere permisos de gestión.');return false}
function requireAdmin(){if(isAdmin())return true;showToast('Esta acción requiere permisos de administrador.');return false}
function available(p,d){if(p.exceptions.includes(d))return false;const j=[4,5,6].indexOf(dateObj(d).getDay());if(j<0)return null;return p.availability[j]}
function conflict(p,d){if(p.exceptions.includes(d))return 'Tiene una excepción de disponibilidad para esta fecha.';if(db.notices.some(n=>n.employeeId===p.id&&n.date===d&&n.status!=='Resuelto'&&['Indisponibilidad','Enfermedad','Cambio de disponibilidad'].includes(n.reason)))return 'Ha enviado un aviso que afecta a esta jornada.';if(available(p,d)===0)return 'No tiene disponibilidad habitual para este día.';return ''}
function nav(){const tabs=[['home','Inicio','home'],['schedule','Horarios','clock'],['team','Equipo','team'],['wallet','Cartera','wallet'],['profile','Perfil','user']];$('#nav').innerHTML=tabs.map(([id,label,ico])=>`<button class="nav-item ${view===id||(view==='detail'&&id==='team')?'active':''} ${id==='wallet'&&!canMoney()?'locked':''}" data-action="nav" data-view="${id}" ${view===id||(view==='detail'&&id==='team')?'aria-current="page"':''} aria-label="${label}${id==='wallet'&&!canMoney()?', acceso restringido':''}">${icon(ico)}<span>${label}</span></button>`).join('');const b=$('.demo-switch');b.innerHTML=`${sessionRole==='admin'?'Vista de encargado':sessionRole==='partial'?'Administrador parcial':'Vista de trabajador'} ${icon('down')}`}
function render(keepScroll=false){const y=viewport.scrollTop;nav();const renderers={home:homeView,schedule:scheduleView,team:teamView,detail:detailView,wallet:walletView,profile:profileView};screen.innerHTML=`<section class="page page-${view}" aria-label="${({home:'Inicio',schedule:'Horarios',team:'Equipo',detail:'Ficha del trabajador',wallet:'Cartera',profile:'Perfil personal'})[view]}">${renderers[view]()}</section>`;viewport.scrollTop=keepScroll?y:0}
function go(next){if(draft){openModal('discard',{target:next});return}view=next;selectedEmployee=null;teamEdit=false;teamQuery='';walletQuery='';render()}
function upcoming(){const rows=db.shifts.filter(s=>s.date>=DEMO_DAY&&(sessionRole!=='worker'||s.employeeId==='alejandro'));return rows.length?rows.map(s=>s.date).sort()[0]:null}
function homeView(){const next=upcoming(),rows=next?db.shifts.filter(s=>s.date===next&&(sessionRole!=='worker'||s.employeeId==='alejandro')):[],total=monthStats(sessionRole==='worker'?'alejandro':null),count=new Set(rows.map(s=>s.employeeId)).size,first=rows.map(s=>s.start).sort()[0];let notices=db.notices.filter(n=>sessionRole!=='worker'||n.employeeId==='alejandro');const rank={Pendiente:0,Revisado:1,Resuelto:2};notices.sort((a,b)=>rank[a.status]-rank[b.status]||b.sentAt.localeCompare(a.sentAt));return `<header class="home-head"><button class="icon-button home-options" data-action="session" aria-label="Opciones del prototipo">${icon('settings')}</button><svg class="wordmark" viewBox="0 0 191 40" role="img" aria-label="VESSEL"><text x="4" y="31">VESSEL</text><text x="4" y="31" style="stroke-width:.35;fill:#222425;transform:translate(.25px,.25px) scale(.99);transform-origin:center">VESSEL</text></svg><p class="home-date">Jueves, 05 noviembre</p></header><div class="metric-grid"><button class="metric panel" data-action="upcoming"><span class="metric-label">Próxima apertura</span><strong class="metric-value">${next?next.slice(8):'—'}</strong><span class="metric-unit">${next?new Intl.DateTimeFormat('es-ES',{month:'short'}).format(dateObj(next)).replace('.','').toUpperCase():'Sin programar'}</span></button><button class="metric panel" data-action="upcoming"><span class="metric-label">${sessionRole==='worker'?'Tus próximos turnos':'Personal asignado'}</span><strong class="metric-value">${sessionRole==='worker'?rows.length:count}</strong><span class="metric-unit">${sessionRole==='worker'?'en tu próxima jornada':'personas'}</span></button><button class="metric panel" data-action="nav" data-view="${canMoney()?'wallet':'profile'}"><span class="metric-label">${sessionRole==='worker'?'Tus horas previstas':'Total horas previstas'}</span><strong class="metric-value">${fmt(total.total)}<span style="font-size:.75em"> h</span></strong><span class="metric-unit">Noviembre 2026</span></button><button class="metric panel" data-action="upcoming"><span class="metric-label">Hora de entrada</span><strong class="metric-value time">${first||'—'}</strong><span class="metric-unit">Próxima jornada</span></button></div><div class="section-heading"><h2>Avisos</h2><small>${notices.filter(n=>n.status==='Pendiente').length} pendientes</small></div><div class="stack">${notices.length?notices.map(n=>{const p=employee(n.employeeId);return `<button class="notice-card panel" data-action="notice" data-id="${n.id}">${avatar(p)}<span class="person-text"><span class="person-name">${esc(p.name)}</span><span class="notice-message" style="display:block">${esc(n.message)}</span><span class="notice-meta">${n.status==='Pendiente'?'<span class="pending-dot"></span>':''}${esc(n.status)} · ${dayLabel(n.date)}</span></span>${icon('chevron','chevron')}</button>`}).join(''):'<p class="empty small">No hay avisos pendientes.</p>'}</div>`}
function scheduleRows(){return (draft||db.shifts.filter(s=>s.date===selectedDate)).filter(s=>sessionRole!=='worker'||s.employeeId==='alejandro')}
function scheduleView(){const rows=scheduleRows(),hours=rows.reduce((a,s)=>a+duration(s),0),active=db.employees.filter(p=>p.active).length;return `<header class="page-head"><h1>Horarios</h1>${canEdit()?`<button class="pill" data-action="${draft?'save-day':'edit-day'}">${draft?'Guardar':'Editar'}</button>`:''}</header><button class="pill date-control" data-action="calendar">${dayLabel(selectedDate)} ${icon('down')}</button><div class="panel summary-strip"><div class="summary-item"><span class="summary-value">${active}</span><span class="summary-label">Empleados</span></div><div class="summary-item"><span class="summary-value" id="day-count">${rows.length}</span><span class="summary-label">${sessionRole==='worker'?'Tus turnos':'Turnos'}</span></div><div class="summary-item"><span class="summary-value" id="day-hours">${fmt(hours)} h</span><span class="summary-label">Horas previstas</span></div></div>${draft?'<div class="draft-guidance"><span>Toca un turno para editarlo.</span><button data-action="cancel-draft">Cancelar</button></div>':''}<div class="shift-list">${rows.length?rows.map(s=>shiftMarkup(s)).join(''):`<div class="empty">${icon('calendar')}<h2>${sessionRole==='worker'?'No tienes turnos este día':'Sin turnos programados'}</h2><p>${canEdit()?'Puedes planificar esta jornada, también si es una apertura extraordinaria.':'Selecciona otra fecha para consultar tu planificación.'}</p>${canEdit()&&!draft?'<button class="secondary" data-action="edit-day">Planificar jornada</button>':''}</div>`}</div>${draft?`<button class="secondary add-button" data-action="add-picker">${icon('plus')} Añadir trabajador</button>`:''}`}
function shiftMarkup(s){const p=employee(s.employeeId);return draft?`<article class="shift-card panel compact-edit" data-shift="${s.id}"><button class="shift-main" data-action="edit-draft-shift" data-id="${s.id}" aria-label="Editar turno de ${esc(p.name)}">${avatar(p)}<span class="shift-person"><strong>${esc(p.name)}</strong><span class="person-sub" style="display:block">${esc(p.job)} · ${fmt(duration(s))} h</span></span><span class="time-chip">${s.start}–${s.end}</span></button><button class="icon-button remove-compact" data-action="remove-shift" data-id="${s.id}" aria-label="Retirar a ${esc(p.name)} de la jornada">${icon('close')}</button></article>`:`<button class="shift-card panel" data-action="shift-detail" data-id="${s.id}">${avatar(p)}<span class="shift-person"><strong>${esc(p.name)}</strong><span class="shift-role"> · ${esc(p.job)}</span></span><span class="time-chip">${s.start}–${s.end}</span></button>`}

function searchMarkup(kind,value){return `<div class="search">${icon('search')}<label class="sr-only" for="${kind}-search">Buscar trabajador</label><input type="search" id="${kind}-search" placeholder="Buscar trabajador" value="${esc(value)}" autocomplete="off" data-search="${kind}"></div>`}
function dayChips(p,wide=false){return p.availability.map((v,i)=>`<span class="day-chip ${v===0?'off':v===null?'unknown':''} ${wide?'wide':''}" title="${['Jueves','Viernes','Sábado'][i]}: ${v===1?'disponible':v===0?'no disponible':'sin información'}" aria-label="${['Jueves','Viernes','Sábado'][i]}: ${v===1?'disponible':v===0?'no disponible':'sin información'}">${wide?['05 J','06 V','07 S'][i]:['J','V','S'][i]}</span>`).join('')}
function matches(p,q){return p.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(q.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase())}
function pageSize(kind,total){return innerWidth>699?Math.max(1,total):Math.max(2,Math.min(5,Math.floor((innerHeight-(kind==='team'?310:420))/(kind==='team'?89:44))))}
function teamPeople(){const order=['alejandro','lucia','miriam','samir','angel','filipa','sergio'];return db.employees.filter(p=>(p.active||teamEdit)&&matches(p,teamQuery)).sort((a,b)=>{const ai=order.indexOf(a.id),bi=order.indexOf(b.id);return (ai<0?99:ai)-(bi<0?99:bi)})}
function paged(items,kind){const size=pageSize(kind,items.length),last=Math.max(0,Math.ceil(items.length/size)-1);if(kind==='team')teamPage=Math.min(teamPage,last);else walletPage=Math.min(walletPage,last);const page=kind==='team'?teamPage:walletPage;return items.slice(page*size,(page+1)*size)}
function pagination(kind){const count=kind==='team'?teamPeople().length:walletPeople().length,size=pageSize(kind,count),pages=Math.ceil(count/size),page=kind==='team'?teamPage:walletPage;if(pages<=1)return '';return `<div class="pagination"><button class="icon-button" data-action="page-prev" data-kind="${kind}" aria-label="Página anterior" ${page===0?'disabled':''}>${icon('left')}</button><span>${page*size+1}–${Math.min(count,(page+1)*size)} de ${count}</span><button class="icon-button" data-action="page-next" data-kind="${kind}" aria-label="Página siguiente" ${page===pages-1?'disabled':''}>${icon('chevron')}</button></div>`}
function teamRows(){return paged(teamPeople(),'team').map(p=>`<button class="employee-row panel" data-action="${teamEdit?'edit-person':'person'}" data-id="${p.id}">${avatar(p)}<span class="person-text"><span class="person-name">${esc(p.name)}</span><span class="person-sub" style="display:block">${esc(p.job)}${!p.active?' · Inactivo':''}</span></span>${!teamEdit?`<span class="availability">${dayChips(p)}</span>`:''}${icon(teamEdit?'edit':'chevron','chevron')}</button>`).join('')||'<div class="no-results">No hay trabajadores con ese nombre.</div>'}

function teamView(){return `<header class="page-head"><div class="title-group"><h1>Equipo</h1><span class="badge">${db.employees.filter(p=>p.active).length} activos</span></div>${isAdmin()?`<button class="pill" data-action="team-edit">${teamEdit?'Listo':'Editar'}</button>`:''}</header>${searchMarkup('team',teamQuery)}${teamEdit?`<button class="secondary add-button" style="margin:0 0 14px" data-action="new-person">${icon('plus')} Añadir trabajador</button>`:''}<div class="stack" id="team-list">${teamRows()}</div><div id="team-pagination">${pagination('team')}</div><div class="legend"><span><i></i>Disponible</span><span><i class="off"></i>No disponible</span><span><i class="unknown"></i>Sin información</span></div>`}
function detailView(){const p=employee(selectedEmployee);if(!p)return '<p>Trabajador no encontrado.</p>';const h=monthStats(p.id),money=canMoney()||p.id==='alejandro';return `<div class="detail-top"><button class="pill" data-action="back-team">← Volver</button>${isAdmin()?`<button class="icon-button" data-action="edit-person" data-id="${p.id}" aria-label="Editar ficha de ${esc(p.name)}">${icon('edit')}</button>`:''}</div><header class="identity">${avatar(p,'large')}<h1>${esc(p.name)}</h1><p>${esc(p.job)} · ${fmt(h.total)} h este mes</p>${!p.active?'<span class="badge">Inactivo</span>':''}</header><div class="stack"><div class="panel detail-panel"><p class="detail-label">Disponibilidad habitual</p><div class="detail-availability">${dayChips(p)}</div>${p.exceptions.length?`<p class="exception">Excepciones: ${p.exceptions.map(d=>dayLabel(d)).join(' · ')}</p>`:''}</div><div class="panel detail-panel">${money?`<div class="detail-line"><span>Tarifa:</span><span>${p.rate==null?'Sin configurar':fmt(p.rate)+' €/h'}</span></div>`:''}<div class="detail-line"><span>Permisos:</span><span>${esc(p.role)}</span></div></div><div class="panel detail-panel"><p class="detail-label">Desglose de horas · Noviembre</p><div class="hours-breakdown"><strong>Total: ${fmt(h.total)} h</strong><span>Tarde: ${fmt(h.afternoon)} h</span><span>Noche: ${fmt(h.night)} h</span></div></div>${money?`<div class="panel detail-panel"><p class="detail-label">Salario previsto</p><div class="salary-line"><strong>${euro(h.money)}</strong><small>${h.missing?'Hay turnos sin tarifa':fmt(h.total)+' h · tarifas de cada turno'}</small></div></div>`:''}</div>`}
function walletPeople(){return db.employees.filter(p=>matches(p,walletQuery)).map(p=>({p,h:stats(p.id)})).filter(({p,h})=>p.active||h.total)}
function walletRows(){return paged(walletPeople(),'wallet').map(({p,h})=>`<tr><td><button data-action="person" data-id="${p.id}">${esc(p.name)}${['angel','miriam','alejandro'].includes(p.id)?` <span class="quiet">(${esc(p.job)})</span>`:''}</button></td><td>${fmt(h.total)} h</td><td>${h.missing?'Sin tarifa':euro(h.money)}</td></tr>`).join('')||'<tr><td colspan="3" style="text-align:center;color:var(--muted)">No hay resultados.</td></tr>'}

function walletView(){if(!canMoney())return `<div class="empty">${icon('lock')}<h2>Acceso restringido</h2><p>Tu perfil reúne tus horas y tu remuneración prevista.</p><button class="secondary" data-action="nav" data-view="profile">Ir a mi perfil</button></div>`;const h=stats();return `<header class="page-head wallet-header"><div><h1>Cartera</h1><p class="subtitle">Control salarial</p></div><button class="pill" data-action="period">${esc(period.label)} ${icon('down')}</button></header><div class="wallet-layout"><div class="wallet-overview"><div class="wallet-total panel"><p class="muted">Total salarios previstos</p><p class="total-amount" id="wallet-total">${euro(h.money)}</p><p class="muted small">Total a remunerar · ${esc(period.label)}</p></div>${searchMarkup('wallet',walletQuery)}</div><div class="wallet-list"><table class="salary-table"><thead><tr><th scope="col">Remuneración</th><th scope="col">h</th><th scope="col">Salario</th></tr></thead><tbody id="wallet-rows">${walletRows()}</tbody></table><div id="wallet-pagination">${pagination('wallet')}</div><p class="footnote">Importes previstos a partir de los turnos programados.${h.missing?' Hay '+h.missing+' turnos sin tarifa configurada.':''}</p></div></div>`}

function profileView(){const p=current(),h=monthStats(p.id);return `<header class="page-head tight"><div><h1>Perfil Personal</h1><p class="subtitle">Autogestión de empleado</p></div></header><div class="stack"><div class="panel profile-card"><div class="profile-identity">${avatar(p,'medium')}<div><p class="person-name">${esc(p.name)}</p><p class="person-sub">${esc(p.job)} · ${fmt(h.total)} h este mes</p></div></div><div class="tags"><span class="tag">Tarifa: ${p.rate==null?'Sin configurar':fmt(p.rate)+' €/h'}</span><span class="tag">Rol: ${esc(p.role)}</span></div><p class="profile-availability">Disponibilidad habitual: [ ${p.availability.map((v,i)=>v===1?['J','V','S'][i]:null).filter(Boolean).join(' · ')} ]</p></div><form class="panel notice-form" id="notice-form"><h2>Avisar</h2><div class="form-line"><label for="notice-date">Fecha:</label><input id="notice-date" name="date" type="date" value="2026-11-06" required></div><div class="form-line"><label for="notice-reason">Motivo:</label><select id="notice-reason" name="reason"><option>Indisponibilidad</option><option>Enfermedad</option><option>Cambio de disponibilidad</option><option>Otro</option></select></div><label for="notice-message" class="sr-only">Mensaje del aviso</label><textarea id="notice-message" name="message" required minlength="5" maxlength="1000" placeholder="Explica qué ha ocurrido…">No puedo trabajar porque tengo un examen.</textarea><button type="submit" class="primary">Enviar aviso</button><p class="form-hint">El aviso se enviará al encargado para su revisión.</p></form><div class="panel profile-summary"><div class="hours-breakdown"><span>Total: ${fmt(h.total)} h</span><span>Tarde: ${fmt(h.afternoon)} h</span><span>Noche: ${fmt(h.night)} h</span></div><div class="detail-line"><span>Salario previsto:</span><strong>${euro(h.money)}</strong></div></div></div><p class="footnote">Noviembre 2026 · Datos de tu planificación.</p>`}
function startEdit(){if(!requireManager())return;draft=structuredClone(db.shifts.filter(s=>s.date===selectedDate));render()}
function validateShift(s){return /^\d{2}:\d{2}$/.test(s.start)&&/^\d{2}:\d{2}$/.test(s.end)&&duration(s)>0&&duration(s)<24}
function saveDay(){if(!requireManager())return;if(!draft)return;if(draft.some(s=>!validateShift(s))){showToast('Revisa las horas. La entrada y la salida deben ser diferentes.');return}const rows=structuredClone(draft);if(commit(next=>{next.shifts=next.shifts.filter(s=>s.date!==selectedDate).concat(rows)})){draft=null;render(true);showToast('Jornada guardada. Horas e importes actualizados.')}}
function updateTime(input){if(!draft||!canEdit())return;const s=draft.find(s=>s.id===input.dataset.id);if(!s||!input.value)return;s[input.dataset.time]=input.value;Object.assign(s,timestamps(s.date,s.start,s.end));$(`[data-duration="${s.id}"]`).textContent=fmt(duration(s))+' h previstas';$(`[data-nextday="${s.id}"]`).textContent=mins(s.end)<mins(s.start)?'Salida al día siguiente':'';$('#day-hours').textContent=fmt(draft.reduce((a,s)=>a+duration(s),0))+' h'}
function openModal(kind,data={}){if(!modalRoot.innerHTML)modalOpener=document.activeElement;modal={kind,...data};drawModal()}
function closeModal(){modal=null;modalRoot.innerHTML='';$('#viewport').inert=false;$('#nav').inert=false;modalOpener?.isConnected&&modalOpener.focus();modalOpener=null}
function sheet(title,body){return `<div class="overlay" data-overlay="true"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"><div class="sheet-handle" aria-hidden="true"></div><div class="sheet-header"><h2 id="sheet-title">${title}</h2><button class="icon-button" data-action="close-modal" aria-label="Cerrar">${icon('close')}</button></div>${body}</div></div>`}
function drawModal(){let title='',body='';const m=modal;
 if(m.kind==='calendar'){
  if(!m.month)m.month=selectedDate.slice(0,7)+'-01';const first=dateObj(m.month),year=first.getFullYear(),month=first.getMonth(),offset=(first.getDay()+6)%7,days=new Date(year,month+1,0).getDate();title='Seleccionar jornada';body=`<div class="calendar-heading"><button class="icon-button" data-action="calendar-prev" aria-label="Mes anterior">${icon('left')}</button><strong>${monthLabel(m.month)}</strong><button class="icon-button" data-action="calendar-next" aria-label="Mes siguiente">${icon('chevron')}</button></div><div class="calendar-grid">${['L','M','X','J','V','S','D'].map(x=>`<span class="calendar-weekday">${x}</span>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:days},(_,i)=>{const d=`${year}-${String(month+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`,weekday=dateObj(d).getDay(),scheduled=db.shifts.some(s=>s.date===d&&(sessionRole!=='worker'||s.employeeId==='alejandro'));return `<button class="calendar-day ${[4,5,6].includes(weekday)?'habitual':''} ${scheduled?'scheduled':''} ${d===selectedDate?'selected':''} ${d===DEMO_DAY?'today':''}" data-action="choose-date" data-date="${d}" aria-label="${dayLabel(d,true)}${scheduled?', con turnos':''}" ${d===selectedDate?'aria-pressed="true"':''}>${i+1}</button>`}).join('')}</div><p class="calendar-legend">J · V · S: actividad habitual. El punto indica turnos programados.</p>`;
 }else if(m.kind==='add-picker'){
  title='Añadir trabajador';const assigned=new Set((draft||[]).map(s=>s.employeeId));body=`<p class="sheet-subtitle">Selecciona a quién quieres añadir a ${dayLabel(selectedDate)}.</p>${searchMarkup('picker',m.query||'')}<div class="stack" id="picker-list">${pickerRows(assigned,m.query||'')}</div>`;
 }else if(m.kind==='add-shift'){
  const p=employee(m.employeeId),warning=conflict(p,selectedDate);title='Nuevo turno';body=`<div class="notice-detail-person">${avatar(p,'medium')}<div><p class="person-name">${esc(p.name)}</p><p class="person-sub">${esc(p.job)} · ${dayLabel(selectedDate)}</p></div></div><form id="add-shift-form"><div class="edit-times"><label>Entrada<input type="time" name="start" required value="20:00"></label><label>Salida<input type="time" name="end" required value="04:00"></label></div><p class="footnote" id="new-duration">8 h previstas · salida al día siguiente</p>${warning?`<div class="warning"><strong>Revisa su disponibilidad</strong>${esc(warning)}</div><label class="check-line"><input type="checkbox" name="override" required>Añadir de todas formas. He revisado la incidencia.</label>`:''}<div class="action-row"><button type="button" class="secondary" data-action="add-picker">Volver</button><button type="submit" class="primary">Añadir turno</button></div></form>`;
 }else if(m.kind==='edit-draft-shift'){
  const s=draft?.find(s=>s.id===m.id);if(!s)return closeModal();const p=employee(s.employeeId);title='Editar turno';body=`<div class="notice-detail-person">${avatar(p,'medium')}<div><p class="person-name">${esc(p.name)}</p><p class="person-sub">${esc(p.job)} · ${dayLabel(s.date)}</p></div></div><form id="edit-shift-form"><div class="edit-times"><label>Entrada<input type="time" name="start" aria-label="Entrada de ${esc(p.name)}" required value="${s.start}"></label><label>Salida<input type="time" name="end" aria-label="Salida de ${esc(p.name)}" required value="${s.end}"></label></div><p class="footnote" id="new-duration">${fmt(duration(s))} h previstas${mins(s.end)<mins(s.start)?' · salida al día siguiente':''}</p><button type="submit" class="primary add-button">Aplicar al borrador</button></form>`;
 }else if(m.kind==='shift-detail'){
  const s=db.shifts.find(s=>s.id===m.id);if(!s)return closeModal();const p=employee(s.employeeId);title='Detalle del turno';body=`<div class="notice-detail-person">${avatar(p,'medium')}<div><p class="person-name">${esc(p.name)}</p><p class="person-sub">${esc(p.job)} · ${dayLabel(s.date)}</p></div></div><div class="panel detail-panel"><div class="detail-line"><span>Horario</span><strong>${s.start}–${s.end}</strong></div><div class="detail-line"><span>Duración prevista</span><strong>${fmt(duration(s))} h</strong></div>${mins(s.end)<mins(s.start)?`<div class="detail-line"><span>Salida</span><span>${dayLabel(addDay(s.date,1))}</span></div>`:''}</div>${canEdit()?'<button class="primary add-button" data-action="edit-from-detail">Editar jornada</button>':''}`;
 }else if(m.kind==='notice'){
  const n=db.notices.find(n=>n.id===m.id);if(!n||(sessionRole==='worker'&&n.employeeId!=='alejandro'))return closeModal();const p=employee(n.employeeId);title='Detalle del aviso';body=`<div class="notice-detail-person">${avatar(p,'medium')}<div><p class="person-name">${esc(p.name)}</p><p class="person-sub">${esc(n.reason)}</p></div></div><span class="status-tag">${esc(n.status)}</span><p class="notice-detail-message">${esc(n.message)}</p><p class="notice-detail-info">Fecha afectada: ${dayLabel(n.date,true)}<br>El aviso no modifica los turnos asignados.</p><button class="secondary add-button" data-action="notice-day" data-date="${n.date}">${icon('calendar')} Ver jornada</button>${canEdit()?`<div class="action-row"><button class="secondary" data-action="notice-status" data-id="${n.id}" data-status="Revisado" ${n.status!=='Pendiente'?'disabled':''}>Marcar revisado</button><button class="primary" data-action="notice-status" data-id="${n.id}" data-status="Resuelto" ${n.status==='Resuelto'?'disabled':''}>Resolver aviso</button></div>`:''}`;
 }else if(m.kind==='discard'){
  title='¿Descartar los cambios?';body='<p class="sheet-subtitle">Las modificaciones de esta jornada todavía no se han guardado.</p><div class="action-row"><button class="secondary" data-action="close-modal">Seguir editando</button><button class="primary" data-action="discard-confirm">Descartar</button></div>';
 }else if(m.kind==='period'){
  title='Seleccionar periodo';body=`<form id="period-form"><div class="period-presets"><button class="pill" type="button" data-action="period-month" data-month="2026-10-01">Octubre</button><button class="pill ${period.from==='2026-11-01'&&period.to==='2026-11-30'?'selected':''}" type="button" data-action="period-month" data-month="2026-11-01">Noviembre</button><button class="pill" type="button" data-action="period-week">Semana 02–08 nov</button><button class="pill" type="button" data-action="period-month" data-month="2026-12-01">Diciembre</button></div><label class="field-label">Desde<input type="date" name="from" value="${period.from}" required></label><label class="field-label">Hasta<input type="date" name="to" value="${period.to}" required></label><button class="primary add-button" type="submit">Aplicar periodo</button></form>`;
 }else if(m.kind==='person-form'){
  if(!isAdmin())return closeModal();const p=m.employeeId?employee(m.employeeId):{name:'',job:'Barra',rate:10,availability:[1,1,1],role:'Trabajador',active:true,exceptions:[]};title=m.employeeId?'Editar trabajador':'Añadir trabajador';body=`<form id="person-form"><div class="photo-upload">${m.employeeId?avatar(p,'medium'):icon('user')}<label class="field-label" style="margin:0;flex:1">Fotografía<input type="file" name="photo" id="person-photo" accept="image/png,image/jpeg,image/webp"></label></div><label class="field-label">Nombre<input type="text" name="name" value="${esc(p.name)}" maxlength="60" required></label><label class="field-label">Puesto<select name="job">${['Barra','Staff','DJ','Accesos','Seguridad','Guardarropa'].map(j=>`<option ${j===p.job?'selected':''}>${j}</option>`).join('')}</select></label><label class="field-label">Tarifa para nuevos turnos (€/h)<input type="number" name="rate" min="0" max="500" step="0.01" value="${p.rate??''}" placeholder="Sin configurar"></label><p class="form-hint">Los turnos existentes conservan su tarifa.</p><label class="field-label">Permisos<select name="role">${['Administrador','Administrador parcial','Trabajador'].map(r=>`<option ${r===p.role?'selected':''}>${r}</option>`).join('')}</select></label><p class="detail-label" style="margin:16px 0 8px">Disponibilidad habitual</p><div class="availability-inputs">${['Jueves','Viernes','Sábado'].map((day,i)=>`<label>${day}<select name="day${i}"><option value="1" ${p.availability[i]===1?'selected':''}>Disponible</option><option value="0" ${p.availability[i]===0?'selected':''}>No disponible</option><option value="unknown" ${p.availability[i]===null?'selected':''}>Sin información</option></select></label>`).join('')}</div><label class="field-label">Excepción de disponibilidad (opcional)<input type="date" name="exception" value="${p.exceptions[0]||''}"></label><label class="check-line"><input type="checkbox" name="active" ${p.active?'checked':''}>Trabajador activo</label><button class="primary add-button" type="submit">Guardar trabajador</button></form>`;
 }else if(m.kind==='session'){
  title='Opciones del prototipo';body=`<p class="settings-note">Datos de demostración · Noviembre de 2026.<br>Los cambios se guardan en este navegador.</p><div class="session-options">${[['admin','Encargado','Horarios, equipo y control salarial'],['partial','Administrador parcial','Horarios y avisos; sin acceso económico'],['worker','Alejandro · Trabajador','Turnos propios, perfil y envío de avisos']].map(([r,t,desc])=>`<button class="session-option ${sessionRole===r?'selected':''}" data-action="set-role" data-role="${r}" aria-pressed="${sessionRole===r}"><strong>${t}</strong><span>${desc}</span></button>`).join('')}</div>${isAdmin()?`<form id="settings-form"><div class="edit-times"><label>Noche desde<input type="time" name="nightStart" value="${db.settings.nightStart}" required></label><label>Noche hasta<input type="time" name="nightEnd" value="${db.settings.nightEnd}" required></label></div><button type="submit" class="secondary add-button">Guardar franja nocturna</button></form>`:''}<p class="footnote">Simulación de roles sin autenticación real. Este archivo no contiene datos de producción.</p><button class="secondary add-button danger" data-action="reset-ask">Restablecer demostración</button>`;
 }else if(m.kind==='reset'){
  title='¿Restablecer la demo?';body='<p class="sheet-subtitle">Se reemplazarán los cambios locales por los datos iniciales de demostración.</p><div class="action-row"><button class="secondary" data-action="close-modal">Cancelar</button><button class="primary" data-action="reset-confirm">Restablecer</button></div>';
 }
 modalRoot.innerHTML=sheet(title,body);$('#viewport').inert=true;$('#nav').inert=true;modalRoot.querySelector('.sheet').focus();
}
function pickerRows(assigned,q){return db.employees.filter(p=>p.active&&!assigned.has(p.id)&&matches(p,q)).map(p=>{const warn=conflict(p,selectedDate);return `<button class="employee-row panel" data-action="pick-person" data-id="${p.id}">${avatar(p)}<span class="person-text"><span class="person-name">${esc(p.name)}</span><span class="employee-pick-sub" style="display:block">${esc(p.job)} · ${warn?'Revisar disponibilidad':available(p,selectedDate)===null?'Disponibilidad sin confirmar':'Disponible'}</span></span>${warn?'<span class="unavailable-mark">Aviso</span>':icon('plus','chevron')}</button>`}).join('')||'<p class="no-results">No hay más trabajadores para añadir.</p>'}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b){if(e.target.matches('[data-overlay]'))closeModal();return}const a=b.dataset.action;
 if(a==='nav'){teamPage=0;walletPage=0;go(b.dataset.view)}
 else if(a==='page-prev'||a==='page-next'){const n=a==='page-next'?1:-1;if(b.dataset.kind==='team')teamPage=Math.max(0,teamPage+n);else walletPage=Math.max(0,walletPage+n);render();viewport.scrollTop=0}
 else if(a==='upcoming'){selectedDate=upcoming()||DEMO_DAY;go('schedule')}
 else if(a==='session'){openModal('session')}
 else if(a==='close-modal'){closeModal()}
 else if(a==='calendar'){if(draft)openModal('discard',{target:'calendar'});else openModal('calendar')}
 else if(a==='calendar-prev'||a==='calendar-next'){const d=dateObj(modal.month);d.setMonth(d.getMonth()+(a==='calendar-next'?1:-1));modal.month=iso(d);drawModal()}
 else if(a==='choose-date'){selectedDate=b.dataset.date;closeModal();render()}
 else if(a==='edit-day'){startEdit()}
 else if(a==='cancel-draft'){openModal('discard',{target:'schedule'})}
 else if(a==='discard-confirm'){const target=modal.target;draft=null;closeModal();if(target==='calendar'){render();openModal('calendar')}else go(target)}
 else if(a==='save-day'){saveDay()}
 else if(a==='remove-shift'){if(!draft||!requireManager())return;const i=draft.findIndex(s=>s.id===b.dataset.id);if(i<0)return;const draftRef=draft;const [removed]=draft.splice(i,1);render(true);showToast(employee(removed.employeeId).name+' retirado de este borrador.',()=>{if(draft===draftRef){draft.splice(i,0,removed);render(true)}})}
 else if(a==='undo'){const fn=lastUndo;clearTimeout(toastTimer);lastUndo=null;$('#toast-root').innerHTML='';fn?.()}
 else if(a==='add-picker'){if(!draft||!requireManager())return;openModal('add-picker')}
 else if(a==='pick-person'){if(!draft||!requireManager())return;openModal('add-shift',{employeeId:b.dataset.id})}
 else if(a==='edit-draft-shift'){if(draft&&requireManager())openModal('edit-draft-shift',{id:b.dataset.id})}
 else if(a==='shift-detail'){openModal('shift-detail',{id:b.dataset.id})}
 else if(a==='edit-from-detail'){closeModal();startEdit()}
 else if(a==='team-edit'){if(!requireAdmin())return;teamEdit=!teamEdit;render(true)}
 else if(a==='person'){if(!employee(b.dataset.id))return;selectedEmployee=b.dataset.id;view='detail';render()}
 else if(a==='back-team'){view='team';selectedEmployee=null;render()}
 else if(a==='edit-person'){if(!requireAdmin())return;openModal('person-form',{employeeId:b.dataset.id})}
 else if(a==='new-person'){if(!requireAdmin())return;openModal('person-form')}
 else if(a==='notice'){openModal('notice',{id:b.dataset.id})}
 else if(a==='notice-day'){selectedDate=b.dataset.date;closeModal();go('schedule')}
 else if(a==='notice-status'){if(!requireManager())return;const id=b.dataset.id,status=b.dataset.status;if(commit(next=>{const n=next.notices.find(n=>n.id===id);n.status=status;if(status==='Resuelto')n.resolvedAt=new Date().toISOString()})){closeModal();render(true);showToast(status==='Resuelto'?'Aviso resuelto.':'Aviso marcado como revisado.')}}
 else if(a==='period'){if(canMoney())openModal('period')}
 else if(a==='period-month'){const d=dateObj(b.dataset.month);period={from:iso(d),to:iso(new Date(d.getFullYear(),d.getMonth()+1,0)),label:monthLabel(iso(d))};closeModal();render()}
 else if(a==='period-week'){period={from:'2026-11-02',to:'2026-11-08',label:'02–08 nov 2026'};closeModal();render()}
 else if(a==='set-role'){sessionRole=b.dataset.role;draft=null;teamEdit=false;closeModal();view='home';render();showToast('Vista de demostración actualizada.')}
 else if(a==='reset-ask'){openModal('reset')}
 else if(a==='reset-confirm'){if(save(seed())){draft=null;sessionRole='admin';period={from:'2026-11-01',to:'2026-11-30',label:'Noviembre 2026'};selectedDate=DEMO_DAY;closeModal();view='home';render();showToast('Demostración restablecida.')}}
});
document.addEventListener('input',e=>{const t=e.target;if(t.matches('[data-time]'))updateTime(t);if(t.dataset.search==='team'){teamQuery=t.value;teamPage=0;$('#team-list').innerHTML=teamRows();$('#team-pagination').innerHTML=pagination('team')}if(t.dataset.search==='wallet'){walletQuery=t.value;walletPage=0;$('#wallet-rows').innerHTML=walletRows();$('#wallet-pagination').innerHTML=pagination('wallet')}if(t.dataset.search==='picker'){modal.query=t.value;$('#picker-list').innerHTML=pickerRows(new Set(draft.map(s=>s.employeeId)),t.value)}if((t.closest('#add-shift-form')||t.closest('#edit-shift-form'))&&t.type==='time'){const f=t.closest('form'),start=f.elements.start.value,end=f.elements.end.value;if(start&&end){const s=makeShift(selectedDate,modal.employeeId,start,end,0);$('#new-duration').textContent=fmt(duration(s))+' h previstas'+(mins(end)<mins(start)?' · salida al día siguiente':'')}}});
document.addEventListener('change',e=>{if(e.target.id==='person-photo'){const file=e.target.files[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)){showToast('Selecciona una imagen JPG, PNG o WebP.');e.target.value='';return}if(file.size>1500000){showToast('Usa una fotografía de menos de 1,5 MB.');e.target.value='';return}modal.photoReady=false;const reader=new FileReader();const targetModal=modal;reader.onload=()=>{if(modal!==targetModal)return;modal.photo=reader.result;modal.photoReady=true;const av=$('.photo-upload .avatar');if(av&&av.tagName==='IMG')av.src=reader.result};reader.onerror=()=>showToast('No se ha podido leer la fotografía.');reader.readAsDataURL(file)}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(!f.reportValidity())return;
 if(f.id==='notice-form'){const data=new FormData(f),message=String(data.get('message')).trim();if(message.length<5){showToast('Escribe un mensaje de al menos 5 caracteres.');return}if(commit(next=>next.notices.unshift({id:uid(),employeeId:'alejandro',date:data.get('date'),reason:data.get('reason'),message,status:'Pendiente',sentAt:new Date().toISOString()}))){f.elements.message.value='';showToast('Aviso enviado. Pendiente de revisión por el encargado.')}}
 else if(f.id==='add-shift-form'){if(!draft||!requireManager())return;const data=new FormData(f),p=employee(modal.employeeId);if(!p?.active)return;if(conflict(p,selectedDate)&&!data.get('override'))return;const s=makeShift(selectedDate,p.id,data.get('start'),data.get('end'),p.rate);if(!validateShift(s)){showToast('La entrada y la salida deben ser diferentes.');return}if(draft.some(x=>x.employeeId===p.id)){showToast('Este trabajador ya está en la jornada.');return}draft.push(s);closeModal();render(true);showToast(p.name+' añadido al borrador.')}
 else if(f.id==='edit-shift-form'){if(!draft||!requireManager())return;const data=new FormData(f),s=draft.find(s=>s.id===modal.id);if(!s)return;const updated={...s,start:data.get('start'),end:data.get('end'),...timestamps(s.date,data.get('start'),data.get('end'))};if(!validateShift(updated)){showToast('La entrada y la salida deben ser diferentes.');return}Object.assign(s,updated);closeModal();render(true);showToast('Turno actualizado en el borrador.')}
 else if(f.id==='period-form'){if(!canMoney())return;const data=new FormData(f),from=data.get('from'),to=data.get('to');if(to<from){showToast('La fecha final debe ser igual o posterior a la inicial.');return}period={from,to,label:dayLabel(from)+'–'+dayLabel(to)};closeModal();render()}
 else if(f.id==='person-form'){if(!requireAdmin())return;if(modal.photoReady===false){showToast('Espera a que termine de cargarse la fotografía.');return}const data=new FormData(f),old=modal.employeeId?employee(modal.employeeId):null,name=String(data.get('name')).trim();if(!name){showToast('Escribe el nombre del trabajador.');return}const person={...(old||{}),id:old?.id||uid(),name,job:data.get('job'),rate:data.get('rate')===''?null:Number(data.get('rate')),role:data.get('role'),availability:[0,1,2].map(i=>data.get('day'+i)==='unknown'?null:Number(data.get('day'+i))),active:!!data.get('active'),exceptions:data.get('exception')?[data.get('exception')]:[],photo:modal.photo||old?.photo||null};if(person.id==='alejandro'&&!person.active){showToast('La cuenta de demostración debe permanecer activa.');return}if(commit(next=>{const i=next.employees.findIndex(p=>p.id===person.id);if(i<0)next.employees.push(person);else next.employees[i]=person})){closeModal();render(true);showToast(old?'Ficha actualizada.':'Trabajador añadido.')}}
 else if(f.id==='settings-form'){if(!requireAdmin())return;const data=new FormData(f);if(data.get('nightStart')===data.get('nightEnd')){showToast('Define dos horas diferentes para la franja nocturna.');return}if(commit(next=>{next.settings.nightStart=data.get('nightStart');next.settings.nightEnd=data.get('nightEnd')})){closeModal();render(true);showToast('Franja nocturna actualizada.')}}
});
document.addEventListener('keydown',e=>{if(!modal)return;if(e.key==='Escape'){e.preventDefault();closeModal()}if(e.key==='Tab'){const focusable=Array.from(modalRoot.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex="0"]'));const first=focusable[0],last=focusable[focusable.length-1];if(!focusable.length)return;if(e.shiftKey&&(document.activeElement===first||document.activeElement===modalRoot.querySelector('.sheet'))){e.preventDefault();last.focus()}else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===modalRoot.querySelector('.sheet'))){e.preventDefault();first.focus()}}});
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{teamPage=0;walletPage=0;if(!modal)render(true)},120)});
window.addEventListener('beforeunload',e=>{if(draft){e.preventDefault();e.returnValue=''}});
render();
</script>
</body>
