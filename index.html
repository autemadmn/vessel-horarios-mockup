<!doctype html>

    />
    <title>VESSEL · Horarios y equipo</title>
    <link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg" />
    <!-- Intro de marca: se decide antes del primer pintado para que nunca parpadee al saltarla. -->
    <script>
      (function () {
        var seen = false;
        try { seen = sessionStorage.getItem("vessel-intro-seen") === "1"; } catch (e) {}
        if (/[?&]intro=0(&|$)/.test(location.search)) seen = true;
        if (/[?&]intro=(1|debug)(&|$)/.test(location.search)) seen = false;
        document.documentElement.classList.add(seen ? "no-intro" : "intro-active");
      })();
    </script>
    <style>
      /* Estilos críticos de la intro, en línea para que el logo se dibuje en el primer pintado. */
      .intro { display: none; }
      .intro-active .intro { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; }
      .intro-veil { position: absolute; inset: 0; background: #0e0f12; }
      .intro.is-opening .intro-veil {
        -webkit-mask: radial-gradient(circle var(--hr, 0px) at var(--hx, 50%) var(--hy, 50%), transparent calc(100% - 1.5px), #000 100%);
        mask: radial-gradient(circle var(--hr, 0px) at var(--hx, 50%) var(--hy, 50%), transparent calc(100% - 1.5px), #000 100%);
      }
      .intro-logo { position: relative; width: min(58vw, 15rem); aspect-ratio: 271 / 284.6; margin-top: -6vh; }
      .intro-logo svg { position: absolute; overflow: hidden; }
      .intro-logo g { fill: none; stroke: #fff; stroke-width: 3.9; stroke-miterlimit: 10; }
      .intro-emblem { left: 29.889%; top: 0; width: 39.483%; height: 44.975%; }
      .intro-word { left: 0; top: 51.757%; width: 100%; height: 35.893%; }
      .intro-club { left: 33.21%; top: 93.324%; width: 32.841%; height: 6.676%; }
      /* 1. las tres V se trazan como a pulso: baja un brazo, sube el otro */
      .intro-v { stroke-dasharray: 1; stroke-dashoffset: 1; animation: intro-draw 460ms cubic-bezier(0.33, 0, 0.2, 1) both; animation-delay: calc(40ms + var(--i, 0) * 50ms); }
      /* 2. el pie de la copa se asienta desde el centro */
      .intro-foot { transform-box: fill-box; transform-origin: center; transform: scaleX(0); animation: intro-grow 200ms cubic-bezier(0.215, 0.61, 0.355, 1) 470ms both; }
      /* 3. VESSEL sube letra a letra desde su línea base */
      .intro-word path { transform-box: fill-box; transform: translateY(104%); animation: intro-rise 360ms cubic-bezier(0.215, 0.61, 0.355, 1) both; animation-delay: calc(180ms + var(--i, 0) * 30ms); }
      /* 4. CLUB se descubre de izquierda a derecha, como luz a lo largo de un rótulo */
      .intro-club { clip-path: inset(-20% 100% -20% 0); animation: intro-wipe 320ms cubic-bezier(0.215, 0.61, 0.355, 1) 460ms both; }
      .intro-rim { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
      .intro-rim circle { fill: none; stroke: #9a83d4; stroke-width: 1.5; opacity: 0; }
      .intro-active .home-head .brand { opacity: 0; }
      @keyframes intro-draw { to { stroke-dashoffset: 0; } }
      @keyframes intro-grow { to { transform: none; } }
      @keyframes intro-rise { to { transform: none; } }
      @keyframes intro-wipe { to { clip-path: inset(-20% 0 -20% 0); } }
      @media (prefers-reduced-motion: reduce) {
        .intro-active .intro * { animation: none !important; }
        .intro-v { stroke-dashoffset: 0; }
        .intro-foot, .intro-word path { transform: none; }
        .intro-club { clip-path: none; }
      }
    </style>

    <script>

      const STORE = "vessel.iter04.v1",

      /* Iconos Lucide (ISC) · https://lucide.dev — trazo, tamaño y alineación comunes. */
      const icons = {

        notice: '<path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>',
        copy: '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',

        moon: '<path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/>',
        sun: '<circle cx="12" cy="12" r="4"/><path d="M12 3v1"/><path d="M12 20v1"/><path d="M3 12h1"/><path d="M20 12h1"/><path d="m18.364 5.636-.707.707"/><path d="m6.343 17.657-.707.707"/><path d="m5.636 5.636.707.707"/><path d="m17.657 17.657.707.707"/>',
        userPlus: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/>',
        send: '<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/>',
      };
      /* Versión del modelo local. La v1 (iteración 04) se migra sin perder datos. */
      const DB_VERSION = 2;
      const ROLE_LABEL = { admin: "Encargado", partial: "Administrador parcial", worker: "Trabajador" };
      /* Movimiento: las esperas en JS se omiten si el sistema pide reducir animaciones. */
      const motionOK = () => !matchMedia("(prefers-reduced-motion: reduce)").matches;
      const later = (ms, fn) => (motionOK() ? setTimeout(fn, ms) : fn());
      function icon(k, cls = "") {
        return `<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${icons[k] || icons.user}</svg>`;
      }
      function esc(x) {
        return String(x ?? "").replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      }
      function fmt(n) {
        return new Intl.NumberFormat("es-ES", { maximumFractionDigits: 2, useGrouping: "always" }).format(n);
      }
      function euro(n) {
        return new Intl.NumberFormat("es-ES", {
          style: "currency",
          currency: "EUR",
          useGrouping: "always",
          maximumFractionDigits: Number.isInteger(n) ? 0 : 2,
        }).format(n);
      }
      function dateObj(s) {
        return new Date(s + "T12:00:00");
      }
      function iso(d) {
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      }
      function addDay(s, n) {
        const d = dateObj(s);
        d.setDate(d.getDate() + n);
        return iso(d);
      }
      function cap(s) {
        return s[0].toUpperCase() + s.slice(1);
      }
      function dayLabel(s, long = false) {
        return cap(
          new Intl.DateTimeFormat("es-ES", {
            weekday: long ? "long" : "short",
            day: "2-digit",
            month: long ? "long" : "short",
          })
            .format(dateObj(s))
            .replaceAll(".", ""),
        );
      }
      function monthLabel(s) {
        return cap(new Intl.DateTimeFormat("es-ES", { month: "long", year: "numeric" }).format(dateObj(s)));
      }
      function mins(t) {
        const [h, m] = t.split(":").map(Number);
        return h * 60 + m;
      }
      function timestamps(date, start, end) {
        const a = new Date(date + "T" + start + ":00");
        const b = new Date(date + "T" + end + ":00");
        if (mins(end) < mins(start)) b.setDate(b.getDate() + 1);
        return { startAt: a.toISOString(), endAt: b.toISOString() };
      }
      function makeShift(date, id, start, end, rate) {
        return {
          id: uid(),
          employeeId: id,
          date,
          start,
          end,
          rate,
          status: "previsto",
          ...timestamps(date, start, end),
        };
      }
      function uid() {
        return globalThis.crypto?.randomUUID?.() || "v" + Date.now().toString(36) + Math.random().toString(36).slice(2);
      }
      function duration(s) {
        return (new Date(s.endAt) - new Date(s.startAt)) / 3600000;
      }
      function splitHours(s) {
        let night = 0,
          minute = mins(s.start),
          total = Math.round(duration(s) * 60);
        const cutoff = mins(db.settings.nightStart),
          end = mins(db.settings.nightEnd);
        for (let i = 0; i < total; i++) {
          const t = (minute + i) % 1440;
          if (cutoff > end ? t >= cutoff || t < end : t >= cutoff && t < end) night++;
        }
        return { total: total / 60, night: night / 60, afternoon: (total - night) / 60 };
      }
      function seed() {
        const people = [
          ["angel", "Ángel", "Barra", 10, [1, 1, 1], 95, "Administrador parcial"],
          ["miriam", "Miriam", "Barra", 11, [1, 1, 0], 100, "Trabajador"],
          ["filipa", "Filipa", "Barra", 10, [1, 1, 1], 100, "Trabajador"],
          ["samir", "Samir", "DJ", 15, [0, 1, 1], 60, "Trabajador"],
          ["alejandro", "Alejandro", "Staff", 10, [1, 1, 1], 54.5, "Trabajador"],
          ["sergio", "Sergio", "Staff", 10, [1, 1, 1], 80, "Trabajador"],
          ["lucia", "Lucía", "Barra", 10, [0, 1, 1], 72, "Trabajador"],
          ["elena", "Elena", "Accesos", 10, [null, 1, 1], 48, "Trabajador"],
          ["david", "David", "Seguridad", 12, [1, 1, 1], 56, "Trabajador"],
          ["nora", "Nora", "Guardarropa", 10, [0, 1, 1], 64, "Trabajador"],
          ["pablo", "Pablo", "Seguridad", 12, [1, 1, 1], 88, "Trabajador"],
          ["ines", "Inés", "Barra", 11, [1, 1, 1], 64, "Trabajador"],
        ];
        const employees = people.map(([id, name, job, rate, availability, target, role]) => ({
          id,
          name,
          job,
          rate,
          availability,
          role,
          active: true,
          photo: null,
          exceptions: id === "angel" ? ["2026-11-13"] : [],
          target,
        }));
        const shifts = [];
        const first = [
          ["angel", "20:00"],
          ["miriam", "21:00"],
          ["filipa", "22:00"],
          ["samir", "23:00"],
          ["alejandro", "20:00"],
          ["sergio", "21:30"],
        ];
        first.forEach(([id, start]) =>
          shifts.push(makeShift(DEMO_DAY, id, start, "04:00", employees.find((p) => p.id === id).rate)),
        );
        const dates = [
          "2026-11-06",
          "2026-11-07",
          "2026-11-12",
          "2026-11-13",
          "2026-11-14",
          "2026-11-19",
          "2026-11-20",
          "2026-11-21",
          "2026-11-26",
          "2026-11-27",
          "2026-11-28",
        ];
        employees.forEach((p) => {
          let remaining = p.target - shifts.filter((s) => s.employeeId === p.id).reduce((a, s) => a + duration(s), 0);
          const candidates = dates.filter((d) => {
            const j = [4, 5, 6].indexOf(dateObj(d).getDay());
            return p.availability[j] !== 0 && !p.exceptions.includes(d);
          });
          const each = Math.floor((remaining / candidates.length) * 2) / 2;
          candidates.forEach((d, i) => {
            let h = i === candidates.length - 1 ? remaining : each;
            if (h <= 0) return;
            h = Math.min(h, 15);
            const start = "20:00";
            const endMinutes = (1200 + Math.round(h * 60)) % 1440;
            const end = `${String(Math.floor(endMinutes / 60)).padStart(2, "0")}:${String(endMinutes % 60).padStart(2, "0")}`;
            shifts.push(makeShift(d, p.id, start, end, p.rate));
            remaining -= h;
          });
        });
        return {
          version: DB_VERSION,
          employees,
          shifts,
          history: [],
          settings: { nightStart: "22:00", nightEnd: "06:00" },
          notices: [
            {
              id: "notice-1",
              employeeId: "alejandro",
              date: "2026-11-06",
              reason: "Indisponibilidad",
              message: "No puedo trabajar el viernes porque tengo un examen.",
              status: "Pendiente",
              sentAt: new Date(Date.now() - 3600000).toISOString(),
            },
            {
              id: "notice-2",
              employeeId: "sergio",
              date: "2026-11-07",
              reason: "Enfermedad",
              message: "Estoy malo y no podré acudir el sábado. Os aviso en cuanto sepa cómo evoluciono.",
              status: "Pendiente",
              sentAt: new Date(Date.now() - 7200000).toISOString(),
            },
          ],
        };
      }
      /* Acepta datos guardados por la iteración 04 (v1) y los completa sin alterar turnos, tarifas ni avisos. */
      function migrate(d) {
        if (!d || !Array.isArray(d.shifts) || !Array.isArray(d.employees)) throw Error("Invalid demo");
        if (d.version === 1) d.version = 2;
        if (d.version !== DB_VERSION) throw Error("Unknown version");
        if (!Array.isArray(d.history)) d.history = [];
        if (!Array.isArray(d.notices)) d.notices = [];
        if (!d.settings) d.settings = { nightStart: "22:00", nightEnd: "06:00" };
        d.employees.forEach((p) => {
          if (!Array.isArray(p.exceptions)) p.exceptions = [];
        });
        return d;
      }
      let storageAvailable = true,
        db;
      try {
        const saved = localStorage.getItem(STORE);
        db = saved ? migrate(JSON.parse(saved)) : seed();
      } catch {
        db = seed();
      }
      let teamPage = 0,
        walletPage = 0;
      let view = "home",
        selectedDate = DEMO_DAY,
        sessionRole = "admin",
        selectedEmployee = null,
        teamEdit = false,
        draft = null,
        teamQuery = "",
        walletQuery = "",
        period = { from: "2026-11-01", to: "2026-11-30", label: "Noviembre 2026" },
        modal = null,
        modalOpener = null,
        toastTimer = null,
        lastUndo = null,
        showResolved = false;
      /* Estado solo visual: qué animar en el siguiente render. */
      let lastView = null,
        lastDate = null,
        enterIds = new Set(),
        walletFrom = null,
        tickMemory = new Map(),
        skipEnter = false,
        teamScroll = 0;
      const screen = $("#screen"),
        viewport = $("#viewport"),
        modalRoot = $("#modal-root");
      function employee(id) {
        return db.employees.find((p) => p.id === id);
      }
      function current() {
        return employee("alejandro");
      }
      function canEdit() {
        return sessionRole === "admin" || sessionRole === "partial";
      }
      function canMoney() {
        return sessionRole === "admin";
      }
      function isAdmin() {
        return sessionRole === "admin";
      }

        else render();
      }
      document.addEventListener("click", (e) => {
        const b = e.target.closest("[data-action]");
        if (!b) {
          if (e.target.matches("[data-overlay]")) closeModal();
          return;
        }
        const a = b.dataset.action;
        if (a === "nav") {
          teamPage = 0;
          walletPage = 0;
          go(b.dataset.view);
        } else if (a === "page-prev" || a === "page-next") {
          const n = a === "page-next" ? 1 : -1;
          if (b.dataset.kind === "team") teamPage = Math.max(0, teamPage + n);
          else walletPage = Math.max(0, walletPage + n);
          render();
          viewport.scrollTop = 0;
        } else if (a === "upcoming") {
          selectedDate = upcoming() || DEMO_DAY;
          go("schedule");
        } else if (a === "session") {
          openModal("session");
        } else if (a === "close-modal") {
          closeModal();
        } else if (a === "calendar") {
          if (draft) openModal("discard", { target: "calendar" });
          else openModal("calendar");
        } else if (a === "calendar-prev" || a === "calendar-next") {
          const d = dateObj(modal.month);
          d.setMonth(d.getMonth() + (a === "calendar-next" ? 1 : -1));
          modal.month = iso(d);
          modal.slide = a === "calendar-next" ? "month-next" : "month-prev";
          drawModal();
        } else if (a === "choose-date") {
          /* El día elegido se marca un instante antes de cerrar, para que se perciba la selección. */
          if (modal.choosing) return;
          modal.choosing = true;
          $$(".calendar-day.selected").forEach((x) => x.classList.remove("selected"));
          b.classList.add("selected");
          const date = b.dataset.date;
          later(130, () => {
            if (modal?.kind !== "calendar") return;
            closeModal();
            changeDay(date);
          });
        } else if (a === "day-step") {
          changeDay(addDay(selectedDate, Number(b.dataset.step)));
        } else if (a === "day-today") {
          changeDay(DEMO_DAY);
        } else if (a === "go-day" || a === "notice-day") {
          if (draft) return showToast("Guarda o descarta el borrador antes de cambiar de jornada.");
          if (modal) closeModal(true);
          selectedDate = b.dataset.date;
          go("schedule");
        } else if (a === "copy-week") {
          if (b.dataset.start && !draft) startEdit();
          copyWeek();
        } else if (a === "history") {
          if (canEdit()) openModal("history");
        } else if (a === "conflicts") {
          if (canEdit()) openModal("conflicts");
        } else if (a === "all-notices") {
          openModal("notices");
        } else if (a === "toggle-resolved") {
          showResolved = !showResolved;
          if (modal?.kind === "notices") drawModal();
          else render(true);
        } else if (a === "time-preset") {
          const input = b.closest("form")?.elements[b.dataset.field];
          if (!input) return;
          input.value = b.dataset.value;
          input.dispatchEvent(new Event("input", { bubbles: true }));
        } else if (a === "export-csv") {
          exportCsv();
        } else if (a === "guard-stay") {
          modalRoot.querySelector(".guard")?.remove();
          modalRoot.querySelector(".sheet")?.focus();
        } else if (a === "guard-discard") {
          closeModal(true);
        } else if (a === "exc-add") {
          const input = $("#exc-date"),
            d = input?.value;
          if (!d) return input?.focus();
          if (!modal.exceptions.includes(d)) modal.exceptions = [...modal.exceptions, d].sort();
          modal.dirty = true;
          input.value = "";
          $("#exc-list").innerHTML = excChips(modal.exceptions);
        } else if (a === "exc-remove") {
          modal.exceptions = modal.exceptions.filter((d) => d !== b.dataset.date);
          modal.dirty = true;
          $("#exc-list").innerHTML = excChips(modal.exceptions);
          $("#exc-date")?.focus();
        } else if (a === "edit-day") {
          startEdit();
        } else if (a === "cancel-draft") {
          openModal("discard", { target: "schedule" });
        } else if (a === "discard-confirm") {
          const target = modal.target,
            date = modal.date;
          draft = null;
          closeModal();
          if (target === "date") {
            selectedDate = date;
            render();
          } else if (target === "calendar") {
            render();
            openModal("calendar");
          } else go(target);
        } else if (a === "save-day") {
          saveDay();
        } else if (a === "remove-shift") {
          if (!draft || !requireManager()) return;
          const i = draft.findIndex((s) => s.id === b.dataset.id);
          if (i < 0) return;
          const draftRef = draft;
          const card = b.closest(".shift-card");
          if (card?.classList.contains("item-leave")) return;
          card?.classList.add("item-leave");
          const [removed] = draft.splice(i, 1);
          later(170, () => draft === draftRef && render(true));
          showToast(employee(removed.employeeId).name + " retirado de este borrador.", () => {
            if (draft === draftRef) {
              draft.splice(Math.min(i, draft.length), 0, removed);
              enterIds.add(removed.id);
              render(true);
            }
          });
        } else if (a === "undo") {
          const fn = lastUndo;
          clearTimeout(toastTimer);
          lastUndo = null;
          hideToast();
          fn?.();
        } else if (a === "add-picker") {
          if (!draft || !requireManager()) return;
          openModal("add-picker");
        } else if (a === "pick-person") {
          if (!draft || !requireManager()) return;
          openModal("add-shift", { employeeId: b.dataset.id });
        } else if (a === "edit-draft-shift") {
          if (draft && requireManager()) openModal("edit-draft-shift", { id: b.dataset.id });
        } else if (a === "shift-detail") {
          openModal("shift-detail", { id: b.dataset.id });
        } else if (a === "edit-from-detail") {
          closeModal(true);
          startEdit();
        } else if (a === "team-edit") {
          if (!requireAdmin()) return;
          teamEdit = !teamEdit;
          render(true);
        } else if (a === "person") {
          if (!employee(b.dataset.id)) return;
          const id = b.dataset.id;
          teamScroll = view === "team" ? viewport.scrollTop : 0;
          morphAvatar(b.querySelector(".avatar"), () => {
            selectedEmployee = id;
            view = "detail";
            render();
          }, () => $(".identity .avatar"));
        } else if (a === "back-team") {
          const id = selectedEmployee;
          morphAvatar($(".identity .avatar"), () => {
            view = "team";
            selectedEmployee = null;
            render();
            viewport.scrollTop = teamScroll;
          }, () => $(`#team-list [data-id="${id}"] .avatar`));
        } else if (a === "edit-person") {
          if (!requireAdmin()) return;
          openModal("person-form", { employeeId: b.dataset.id });
        } else if (a === "new-person") {
          if (!requireAdmin()) return;
          openModal("person-form");
        } else if (a === "notice") {
          openModal("notice", { id: b.dataset.id });
        } else if (a === "notice-day") {
          selectedDate = b.dataset.date;
          closeModal();
          go("schedule");
        } else if (a === "notice-status") {
          if (!requireManager()) return;
          const id = b.dataset.id,
            status = b.dataset.status,
            replyField = $("#notice-reply"),
            reply = replyField ? replyField.value.trim() : null;
          if (
            commit((next) => {
              const n = next.notices.find((n) => n.id === id);
              n.status = status;
              if (status === "Resuelto") n.resolvedAt = new Date().toISOString();
              if (reply !== null) {
                if (reply) n.reply = reply;
                else delete n.reply;
              }
            })
          ) {
            closeModal(true);
            render(true);
            showToast(status === "Resuelto" ? "Aviso resuelto." : "Aviso marcado como revisado.");
          }
        } else if (a === "period") {
          if (canMoney()) openModal("period");
        } else if (a === "period-month") {
          const d = dateObj(b.dataset.month);
          walletFrom = stats().money;
          period = { from: iso(d), to: iso(new Date(d.getFullYear(), d.getMonth() + 1, 0)), label: monthLabel(iso(d)) };
          closeModal();
          render();
        } else if (a === "period-week") {
          walletFrom = stats().money;
          period = { from: "2026-11-02", to: "2026-11-08", label: "02–08 nov 2026" };
          closeModal();
          render();
        } else if (a === "set-role") {
          sessionRole = b.dataset.role;
          draft = null;
          showResolved = false;
          teamEdit = false;
          closeModal();
          view = "home";
          render();
          showToast("Vista de demostración actualizada.");
        } else if (a === "reset-ask") {
          openModal("reset");
        } else if (a === "reset-confirm") {
          if (save(seed())) {
            draft = null;
            sessionRole = "admin";
            period = { from: "2026-11-01", to: "2026-11-30", label: "Noviembre 2026" };
            selectedDate = DEMO_DAY;
            showResolved = false;
            closeModal(true);
            view = "home";
            render();
            showToast("Demostración restablecida.");
          }
        }
      });
      document.addEventListener("input", (e) => {
        const t = e.target;
        if (modal && t.closest("#modal-root form[data-guard]")) modal.dirty = true;
        t.form?.querySelectorAll(".field-error.visible").forEach((x) => {
          x.textContent = "";
          x.classList.remove("visible");
        });
        if (t.dataset.search === "team") {
          teamQuery = t.value;
          teamPage = 0;
          $("#team-list").innerHTML = teamRows();
          $("#team-pagination").innerHTML = pagination("team");
        }
        if (t.dataset.search === "wallet") {
          walletQuery = t.value;
          walletPage = 0;
          $("#wallet-rows").innerHTML = walletRows();
          $("#wallet-pagination").innerHTML = pagination("wallet");
        }
        if (t.dataset.search === "picker") {
          modal.query = t.value;
          $("#picker-list").innerHTML = pickerRows(new Set(draft.map((s) => s.employeeId)), t.value);
        }
        if ((t.closest("#add-shift-form") || t.closest("#edit-shift-form")) && t.type === "time") {
          const f = t.closest("form"),
            start = f.elements.start.value,
            end = f.elements.end.value;
          t.closest(".time-field")
            ?.querySelectorAll("[data-action=time-preset]")
            .forEach((c) => {
              c.classList.toggle("is-on", c.dataset.value === t.value);
              c.setAttribute("aria-pressed", c.dataset.value === t.value);
            });
          if (start && end) {
            const s = makeShift(selectedDate, modal.employeeId, start, end, 0);
            $("#new-duration").textContent =
              fmt(duration(s)) + " h previstas" + (mins(end) < mins(start) ? " · salida al día siguiente" : "");
          }
        }
      });
      document.addEventListener("change", (e) => {
        if (e.target.id === "person-photo") {
          const file = e.target.files[0];
          if (!file) return;
          if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
            showToast("Selecciona una imagen JPG, PNG o WebP.");
            e.target.value = "";
            return;
          }
          if (file.size > 1500000) {
            showToast("Usa una fotografía de menos de 1,5 MB.");
            e.target.value = "";
            return;
          }
          modal.photoReady = false;
          modal.dirty = true;
          const reader = new FileReader();
          const targetModal = modal;
          reader.onload = () => {
            if (modal !== targetModal) return;
            modal.photo = reader.result;
            modal.photoReady = true;
            const av = $(".photo-upload .avatar");
            if (av && av.tagName === "IMG") av.src = reader.result;
          };
          reader.onerror = () => showToast("No se ha podido leer la fotografía.");
          reader.readAsDataURL(file);
        }
      });
      document.addEventListener("submit", (e) => {
        e.preventDefault();
        const f = e.target;
        const inline = ["notice-form", "add-shift-form", "edit-shift-form", "person-form"];
        if (!inline.includes(f.id) && !f.reportValidity()) return;
        if (f.id === "notice-form") {
          const data = new FormData(f),
            message = String(data.get("message")).trim();
          if (!data.get("date")) return fieldError("notice-error", "Indica la fecha afectada.", f.elements.date);
          if (message.length < 5)
            return fieldError("notice-error", "Escribe un mensaje de al menos 5 caracteres.", f.elements.message);
          if (
            commit((next) =>
              next.notices.unshift({
                id: uid(),
                employeeId: "alejandro",
                date: data.get("date"),
                reason: data.get("reason"),
                message,
                status: "Pendiente",
                sentAt: new Date().toISOString(),
              }),
            )
          ) {
            f.elements.message.value = "";
            showToast("Aviso enviado. Pendiente de revisión por el encargado.");
          }
        } else if (f.id === "add-shift-form") {
          if (!draft || !requireManager()) return;
          const data = new FormData(f),
            p = employee(modal.employeeId);
          if (!p?.active) return;
          if (!data.get("start") || !data.get("end"))
            return fieldError("shift-error", "Indica la hora de entrada y la de salida.", f.elements.start);
          const s = makeShift(selectedDate, p.id, data.get("start"), data.get("end"), p.rate);
          if (!validateShift(s))
            return fieldError("shift-error", "La entrada y la salida deben ser diferentes.", f.elements.end);
          if (draft.some((x) => x.employeeId === p.id))
            return fieldError("shift-error", "Este trabajador ya está en la jornada.");
          if (conflict(p, selectedDate) && !data.get("override"))
            return fieldError("shift-error", "Marca la casilla para confirmar que has revisado la incidencia.", f.elements.override);
          draft.push(s);
          enterIds.add(s.id);
          closeModal(true);
          render(true);
          showToast(p.name + " añadido al borrador.");
        } else if (f.id === "edit-shift-form") {
          if (!draft || !requireManager()) return;
          const data = new FormData(f),
            s = draft.find((s) => s.id === modal.id);
          if (!s) return;
          if (!data.get("start") || !data.get("end"))
            return fieldError("shift-error", "Indica la hora de entrada y la de salida.", f.elements.start);
          const updated = {
            ...s,
            start: data.get("start"),
            end: data.get("end"),
            ...timestamps(s.date, data.get("start"), data.get("end")),
          };
          if (!validateShift(updated))
            return fieldError("shift-error", "La entrada y la salida deben ser diferentes.", f.elements.end);
          Object.assign(s, updated);
          closeModal(true);
          render(true);
          showToast("Turno actualizado en el borrador.");
        } else if (f.id === "period-form") {
          if (!canMoney()) return;
          const data = new FormData(f),
            from = data.get("from"),
            to = data.get("to");
          if (to < from) return fieldError("period-error", "La fecha final debe ser igual o posterior a la inicial.", f.elements.to);
          walletFrom = stats().money;
          period = { from, to, label: dayLabel(from) + "–" + dayLabel(to) };
          closeModal(true);
          render();
        } else if (f.id === "person-form") {
          if (!requireAdmin()) return;
          if (modal.photoReady === false) {
            showToast("Espera a que termine de cargarse la fotografía.");
            return;
          }
          const data = new FormData(f),
            old = modal.employeeId ? employee(modal.employeeId) : null,
            name = String(data.get("name")).trim();
          if (!name) return fieldError("person-error", "Escribe el nombre del trabajador.", f.elements.name);
          if (!f.reportValidity()) return;
          const person = {
            ...(old || {}),
            id: old?.id || uid(),
            name,
            job: data.get("job"),
            rate: data.get("rate") === "" ? null : Number(data.get("rate")),
            role: data.get("role"),
            availability: [0, 1, 2].map((i) =>
              data.get("day" + i) === "unknown" ? null : Number(data.get("day" + i)),
            ),
            active: !!data.get("active"),
            exceptions: modal.exceptions.slice(),
            photo: modal.photo || old?.photo || null,
          };
          if (person.id === "alejandro" && !person.active) {
            showToast("La cuenta de demostración debe permanecer activa.");
            return;
          }
          if (
            commit((next) => {
              const i = next.employees.findIndex((p) => p.id === person.id);
              if (i < 0) next.employees.push(person);
              else next.employees[i] = person;
            })
          ) {
            closeModal(true);
            render(true);
            showToast(old ? "Ficha actualizada." : "Trabajador añadido.");
            return;
          }
        } else if (f.id === "settings-form") {
          if (!requireAdmin()) return;
          const data = new FormData(f);
          if (data.get("nightStart") === data.get("nightEnd")) {
            showToast("Define dos horas diferentes para la franja nocturna.");
            return;
          }
          if (
            commit((next) => {
              next.settings.nightStart = data.get("nightStart");
              next.settings.nightEnd = data.get("nightEnd");
            })
          ) {
            closeModal();
            render(true);
            showToast("Franja nocturna actualizada.");
          }
        }
      });
      document.addEventListener("keydown", (e) => {
        if (!modal) return;
        if (e.key === "Escape") {
          e.preventDefault();
          closeModal();
        }
        if (e.key === "Tab") {
          const focusable = Array.from(
            modalRoot.querySelectorAll(
              'button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex="0"]',
            ),
          );
          const first = focusable[0],
            last = focusable[focusable.length - 1];
          if (!focusable.length) return;
          if (
            e.shiftKey &&
            (document.activeElement === first || document.activeElement === modalRoot.querySelector(".sheet"))
          ) {
            e.preventDefault();
            last.focus();
          } else if (
            !e.shiftKey &&
            (document.activeElement === last || document.activeElement === modalRoot.querySelector(".sheet"))
          ) {
            e.preventDefault();
            first.focus();
          }
        }
      });
      document.addEventListener("focusin", (e) => {
        if (e.target.matches(".sheet input:not([type=checkbox]), .sheet textarea, .sheet select") && innerWidth < 700)
          later(260, () => e.target.isConnected && e.target.scrollIntoView({ block: "nearest", behavior: motionOK() ? "smooth" : "auto" }));
      });
      let resizeTimer;
      window.addEventListener("resize", () => {
        placeIndicator(false);
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          teamPage = 0;
          walletPage = 0;
          if (!modal) render(true);
        }, 120);
      });
      window.addEventListener("beforeunload", (e) => {
        if (draft) {
          e.preventDefault();
          e.returnValue = "";
        }
      });
      render();
      document.documentElement.dataset.ready = "true";
      window.VesselIntro?.ready();
    </script>
    <script src="js/intro.js" defer></script>
  </body>
</html>
